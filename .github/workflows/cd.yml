name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      contents: write
      # Required by actions/attest-build-provenance (Sigstore + GH attestations API).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Extract version
        id: pkg
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying v$VERSION"

      - name: Version guard
        # Mirrors scripts/bump-version.cjs strict-semver gate. Without this,
        # a hand-edited package.json with "1.2.3-alpha" or "01.02.03" would
        # bypass the bump-script protection and publish a malformed git tag
        # + GitHub Release. VERSION is injected via env: rather than expanded
        # into the run-script body to avoid workflow injection patterns.
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Version \"$VERSION\" is not strict SemVer (M.m.p, no leading zeros, no pre-release / build metadata). Fix package.json before deploying."
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version first."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy preflight
        run: npm run deploy:preflight -- --require-project-name-env
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME || '' }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy src --project-name "$PROJECT_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}

      # SLSA Level 2 build provenance for the deployed bundle. Cloudflare
      # Pages does not yet verify attestations server-side, but downstream
      # consumers can: `gh attestation verify <file> --owner <org>`.
      - name: Attest build provenance for deployed bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'src/**/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
